<!DOCTYPE html>
<html lang="ru" data-theme="graphite">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Интерактивная диагностика математических навыков: счёт в пределах 20, 1 класс.">
<title>Карта знаний — Счёт в пределах 20</title>
<style id="design-system">
:root{color-scheme:dark;--bg:#19191e;--glow:#372630;--card-top:#303038;--card-bottom:#26262d;--line:#51515c;--text:#f8f8fa;--muted:#bfc0ca;--primary:#e3123f;--accent:#f3d98b;--border:#858590;--button:#3d3d47;--inset:#17171d;--notice:#f3d98b12;--good:#80d5aa;--bad:#ff91a6;--on-primary:#ffffff;--shadow:#00000022;}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f4f7;--glow:#f7e5eb;--card-top:#ffffff;--card-bottom:#f9f9fc;--line:#c9cbd5;--text:#20212b;--muted:#595c6c;--primary:#bc123b;--accent:#75540c;--border:#777b8b;--button:#e8e9f0;--inset:#ffffff;--notice:#75540c0d;--good:#17643f;--bad:#aa2042;--on-primary:#ffffff;--shadow:#18203512;}
:root[data-theme="night"]{color-scheme:dark;--bg:#101827;--glow:#1d2c49;--card-top:#202e45;--card-bottom:#19253a;--line:#475c78;--text:#f4f7ff;--muted:#bac9de;--primary:#3369c9;--accent:#b9c5ff;--border:#8298b8;--button:#293d59;--inset:#101b2c;--notice:#b9c5ff12;--good:#83d9be;--bad:#ff9fb3;--on-primary:#ffffff;--shadow:#00000022;}
:root[data-theme="sage"]{color-scheme:light;--bg:#f3f5ef;--glow:#e1eadd;--card-top:#ffffff;--card-bottom:#f8faf5;--line:#c5cec0;--text:#223126;--muted:#526552;--primary:#286344;--accent:#66531d;--border:#73836d;--button:#e5ebdf;--inset:#ffffff;--notice:#2863440d;--good:#24603b;--bad:#a4263c;--on-primary:#ffffff;--shadow:#20302012;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,var(--glow),var(--bg) 50%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1050px;margin:auto;padding:25px 16px 70px}
header,.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{margin-bottom:25px}
.brand{font-weight:800;letter-spacing:.06em}
.tag,.pill{border:1px solid var(--border);border-radius:30px;padding:5px 12px;font-size:13px}
.card{background:linear-gradient(135deg,var(--card-top),var(--card-bottom));border:1px solid var(--line);border-radius:22px;padding:24px;margin:17px 0;box-shadow:0 12px 30px var(--shadow)}
h1{font-size:clamp(28px,5vw,43px);line-height:1.15;margin:0 0 16px}
h2{font-size:25px;margin:0 0 14px}
h3{font-size:19px;margin:10px 0}
p{margin:10px 0 15px}
.muted,small{color:var(--muted)}
button{background:var(--button);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer}
button.primary{color:var(--on-primary);background:var(--primary);border-color:var(--primary)}
button.secondary{background:transparent}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
a{color:var(--accent);cursor:pointer}
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}
.notice{padding:12px 15px;background:var(--notice);border-left:3px solid var(--accent);border-radius:6px;margin:14px 0}
.error{border-left-color:var(--bad);background:var(--notice)}
.success{border-left-color:var(--good);background:var(--notice)}
.options{display:grid;gap:9px;margin:18px 0}
.option{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px}
.option b{color:var(--accent);min-width:20px}
.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:18px 0}
.columns>div{background:var(--inset);border-radius:12px;padding:15px}
.columns p{margin:7px 0}
.answer{width:100%;max-width:440px;background:var(--inset);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;font:20px system-ui;letter-spacing:3px}
textarea{width:100%;min-height:230px;background:var(--inset);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
select{background:var(--inset);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 9px}
th{color:var(--accent)}
.scroll{overflow-x:auto}
.wheel{background:linear-gradient(135deg,var(--card-top),var(--card-bottom));border-radius:22px;padding:18px;margin:18px 0}
.wheelHead{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px;font-weight:750}
.wheel svg{display:block;width:100%;max-width:820px;margin:auto}
.sectionPick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sectionPick button{font-size:13px;padding:8px 11px}
.sectionPick button.active{border-color:var(--accent);color:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
#view{min-height:320px}
@media(max-width:600px){main{padding:18px 12px 50px}.card{padding:17px}.columns{grid-template-columns:1fr}.wheel{padding:8px}.wheelHead{font-size:14px;padding:12px 8px}th,td{padding:8px 6px;font-size:12px}button{padding:11px 13px}}
[hidden]{display:none!important} .brand{overflow-wrap:anywhere} .option{cursor:pointer;align-items:flex-start}.option:has(input:checked){border-color:var(--accent);background:var(--notice)}input{accent-color:var(--primary)}.theme{display:flex;align-items:center;gap:8px;font-size:13px}.bar{height:9px;border-radius:10px;background:var(--inset);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.skill-row{padding:13px 0;border-bottom:1px solid var(--line)}.skill-row p{margin:4px 0} .wheel svg{max-width:560px}.wheel svg .grid{stroke:var(--line);fill:none}.wheel svg .result{stroke:var(--accent);fill:var(--notice);stroke-width:3}.wheel svg text{fill:var(--text);font:15px system-ui}h1,h2,h3,p,label{overflow-wrap:anywhere}button,select{min-height:44px}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:22px;font-weight:700;width:100%} .review{border-top:1px solid var(--line);padding:12px 0}
input[type="text"],input[type="number"]{background:var(--inset);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;font:inherit;width:100%;max-width:440px} .option input{flex:0 0 auto;margin-top:5px} .option span{min-width:0} .skill-row h3{margin:0 0 6px} .result-summary{font-size:25px;font-weight:750} .wheel svg{overflow:visible} .question-title{font-size:22px;line-height:1.4;font-weight:700} .error-text{color:var(--bad)}
/* Единый компонент задания: инструкция → материал → ответ */
.card .question-title{font-size:22px;line-height:1.4;font-weight:700;margin:20px 0 18px;letter-spacing:normal}
.task-materials{display:grid;gap:16px;margin:0 0 24px;min-width:0}
.task-material{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.task-material .material-title{font-size:14px;line-height:1.4;font-weight:650;color:var(--muted);margin:0 0 12px}
.material-content{font-size:17px;line-height:1.7;font-weight:400;letter-spacing:normal;overflow-wrap:anywhere}
.material-content p{margin:0 0 14px;white-space:pre-wrap}
.material-content>:last-child{margin-bottom:0}
.material-content ol,.material-content ul{margin:0;padding-left:1.6em}
.material-content li+li{margin-top:12px}
.material-content figure{margin:0}
.material-content img,.material-content svg{display:block;max-width:100%;height:auto}
.material-content figcaption{font-size:14px;color:var(--muted);margin-top:10px}
.material-formula{font-size:22px;line-height:1.6;padding:8px 0}
.material-scroll{max-width:100%;overflow-x:auto}
.material-code{font:15px/1.6 ui-monospace,monospace;white-space:pre-wrap;margin:0}
.answer-group{min-width:0;margin:0}
.answer-group .answer-label{font-size:16px;line-height:1.5;font-weight:600;margin:0 0 12px;padding:0}
.answer-group .options{margin:0}
.answer-group .option{font-size:16px;line-height:1.6;font-weight:400}
.answer-group .answer{font:inherit;letter-spacing:normal}
.answer-hint{font-size:14px;line-height:1.5;color:var(--muted);margin:8px 0 0}
@media(max-width:600px){.card .question-title{font-size:20px}.task-material{padding:16px}.material-content{font-size:16px;line-height:1.65}}
/* Дополнительные состояния интерфейса */
.option input{width:18px;height:18px}
.answer-label{display:block}
.material-table{min-width:260px}
.skill-row .bar{margin-top:8px}
.skill-status{font-weight:650}
.review-answer{display:grid;gap:5px;margin:12px 0}
.review-answer strong{color:var(--accent)}
.small-note{font-size:13px;color:var(--muted)}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* COMIC MARKER / BLOCK-WORLD VISUAL UPDATE */
:root{color-scheme:light;--bg:#fff9ef;--glow:#ffe4ed;--card-top:#fffefa;--card-bottom:#fffefa;--line:#171717;--text:#171717;--muted:#4e4a4a;--primary:#ed2861;--accent:#ffd52e;--border:#171717;--button:#20b9e8;--inset:#fff2c7;--notice:#ffe36a55;--good:#168b55;--bad:#d92b4d;--on-primary:#fff;--shadow:#171717;}
:root[data-theme="light"]{--bg:#fff9ef;--glow:#ffdce8;--card-top:#fffefa;--card-bottom:#fffefa;--line:#171717;--text:#171717;--muted:#4e4a4a;--primary:#ed2861;--accent:#ffd52e;--border:#171717;--button:#20b9e8;--inset:#fff2c7;--notice:#ffe36a55;--good:#168b55;--bad:#d92b4d;--shadow:#171717}
:root[data-theme="graphite"]{--bg:#f9f5ff;--glow:#e8dcff;--card-top:#fff;--card-bottom:#fff;--line:#171717;--text:#171717;--muted:#50475b;--primary:#7b42db;--accent:#ffcf32;--border:#171717;--button:#28bce8;--inset:#f1eaff;--notice:#ffcf324d;--good:#168b55;--bad:#d92b4d;--shadow:#171717}
:root[data-theme="night"]{color-scheme:dark;--bg:#15223b;--glow:#283e70;--card-top:#263957;--card-bottom:#1d2d49;--line:#f8f5ed;--text:#fffdf7;--muted:#d6e2f4;--primary:#ff3f78;--accent:#ffdb43;--border:#fffdf7;--button:#19bce8;--inset:#172640;--notice:#ffdb4330;--good:#7ee0a9;--bad:#ff9caf;--shadow:#050b18}
:root[data-theme="sage"]{--bg:#f1f8e9;--glow:#d5f1d7;--card-top:#fffef7;--card-bottom:#fffef7;--line:#17291d;--text:#17291d;--muted:#425b49;--primary:#e83d6c;--accent:#ffc928;--border:#17291d;--button:#20b9e8;--inset:#e4f3df;--notice:#ffc92855;--good:#168b55;--bad:#bd2445;--shadow:#17291d}
body{background-color:var(--bg);background-image:radial-gradient(var(--line) 0.65px,transparent .65px),radial-gradient(circle at 90% 0,var(--glow),transparent 35%);background-size:15px 15px,auto;background-attachment:fixed;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:.01em}
main{max-width:1100px;padding-top:18px}
header{padding:12px 15px;background:var(--card-top);border:3px solid var(--line);border-radius:17px;box-shadow:5px 5px 0 var(--shadow);transform:rotate(-.25deg)}
.brand{font-weight:1000;letter-spacing:.08em;text-transform:uppercase}
.theme{font-weight:900;text-transform:uppercase}
.card{position:relative;background:var(--card-top);border:3px solid var(--line);border-radius:18px;box-shadow:7px 7px 0 var(--shadow);padding:clamp(18px,3vw,30px);margin:22px 0;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:9px;background:repeating-linear-gradient(135deg,var(--primary) 0 12px,var(--accent) 12px 24px,var(--button) 24px 36px)}
h1,h2,h3{font-weight:1000;letter-spacing:-.035em;text-transform:uppercase}
h1{font-size:clamp(42px,7vw,76px);line-height:.95;text-shadow:3px 3px 0 var(--accent),6px 6px 0 var(--line);margin:12px 0 20px}
h2{font-size:clamp(25px,4vw,36px);text-shadow:2px 2px 0 var(--accent)}
h3{font-size:19px}
button{border:3px solid var(--line);border-radius:11px;box-shadow:3px 3px 0 var(--shadow);font-weight:1000;text-transform:uppercase;transition:transform .12s ease,box-shadow .12s ease}
button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
button.primary{background:var(--primary);color:white;text-shadow:1px 1px 0 #171717}
button.secondary{background:var(--accent);color:#171717}
.pill,.tag{border:2px solid var(--line);border-radius:8px;background:var(--accent);color:#171717;font-weight:1000;text-transform:uppercase;box-shadow:2px 2px 0 var(--shadow)}
.task-material{background:var(--inset);border:2px dashed var(--line);border-radius:13px;box-shadow:3px 3px 0 var(--shadow)}
.material-title{font-weight:1000!important;text-transform:uppercase;letter-spacing:.06em}
.material-formula{font-size:clamp(25px,5vw,34px);font-weight:1000}
.option{border:2px solid var(--line);background:var(--card-top);border-radius:10px;box-shadow:2px 2px 0 var(--shadow);transition:transform .12s ease}
.option:hover{transform:translateX(3px);border-color:var(--primary)}
.option:has(input:checked){border:3px solid var(--primary);background:var(--notice);box-shadow:3px 3px 0 var(--primary)}
.option b{color:var(--primary)}
.answer{border:3px solid var(--line)!important;box-shadow:3px 3px 0 var(--shadow)}
.bar{height:13px;border:2px solid var(--line);background:var(--inset);border-radius:20px}
.bar span{background:repeating-linear-gradient(135deg,var(--primary) 0 10px,var(--accent) 10px 20px,var(--button) 20px 30px)}
.wheel{border:3px solid var(--line);border-radius:15px;background:var(--inset);box-shadow:5px 5px 0 var(--shadow)}
.wheelHead{font-weight:1000;text-transform:uppercase}
.wheel svg .grid{stroke:var(--line);stroke-width:1.5}
.wheel svg .result{stroke:var(--primary);fill:#ed286133;stroke-width:5;stroke-linejoin:round}
.wheel svg text{font-weight:1000;paint-order:stroke;stroke:var(--inset);stroke-width:4px;stroke-linejoin:round}
.skill-row{border-bottom:2px dashed var(--line)}
.skill-row .bar span{background:var(--good)}
.notice{border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:10px;box-shadow:3px 3px 0 var(--shadow)}
.review{border-top:2px dashed var(--line)}
.foot{border-top:2px dashed var(--line);font-weight:800}
.comic-kicker{display:inline-block;padding:5px 10px;background:var(--accent);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-weight:1000;letter-spacing:.1em;transform:rotate(-2deg);font-size:12px}
.cover-card{background:linear-gradient(130deg,var(--card-top) 0 58%,var(--glow) 58% 100%)}
.cover-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:center}
.cover-copy{position:relative;z-index:1}
.cover-subtitle{font-size:clamp(19px,3vw,27px);font-weight:1000;color:var(--primary);line-height:1.15}
.sticker-label{display:inline-block;background:var(--button);border:2px solid var(--line);padding:5px 10px;font-weight:1000;transform:rotate(2deg);box-shadow:3px 3px 0 var(--shadow)}
.hero-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:5px;min-height:230px;padding:18px 5px 25px;background:radial-gradient(circle,var(--accent) 1px,transparent 2px);background-size:12px 12px;border:3px solid var(--line);border-radius:48% 42% 15px 15px;transform:rotate(1deg)}
.hero-sticker{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;padding:5px 8px;background:var(--card-top);border:2px solid var(--line);border-radius:10px;box-shadow:3px 3px 0 var(--shadow);font-size:10px;font-weight:1000;letter-spacing:.04em;transform:rotate(-2deg)}
.hero-stage .hero-sticker{display:flex;flex-direction:column;max-width:31%;padding:5px}
.pixel-hero{width:64px;height:80px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 var(--line))}
.hero-stage .pixel-hero{width:100%;height:130px}
.hero-stage .hero-sticker:nth-child(2){transform:translateY(-18px) rotate(3deg)}
.hero-stage .hero-sticker:nth-child(3){transform:rotate(-4deg)}
.comic-burst{position:absolute;right:-7px;top:-15px;padding:13px 9px;background:var(--primary);color:white;border:3px solid var(--line);clip-path:polygon(50% 0,62% 27%,95% 12%,78% 43%,100% 60%,69% 68%,78% 100%,48% 78%,20% 100%,28% 68%,0 56%,27% 40%,8% 12%,40% 28%);font-weight:1000;text-align:center;transform:rotate(10deg);text-shadow:1px 2px #171717}
.doodle-strip{display:flex;justify-content:space-around;gap:8px;margin-top:22px;padding:9px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);font-weight:1000;letter-spacing:.12em;color:var(--primary);transform:rotate(-.5deg)}
.question-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.question-top .hero-sticker{margin-bottom:6px}
.result-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
.result-heading .hero-sticker{transform:rotate(4deg)}
.result-summary{display:inline-block;padding:7px 13px;background:var(--accent);border:2px solid var(--line);border-radius:9px;box-shadow:3px 3px 0 var(--shadow)}
.object-groups{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.object-group{padding:12px;background:var(--card-top);border:2px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--shadow)}
.object-label{font-size:14px;font-weight:1000;text-transform:uppercase}
.object-label b{display:inline-block;margin-left:5px;background:var(--accent);padding:2px 6px;border:1px solid var(--line);border-radius:5px}
.objects{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:clamp(23px,4vw,32px)}
.plus-sticker{font-size:30px;font-weight:1000;color:var(--primary);text-shadow:2px 2px var(--accent)}
.visual-hint{grid-column:1/-1;text-align:center;font-weight:1000;color:var(--primary);text-transform:uppercase}
@media(max-width:650px){.cover-layout{grid-template-columns:1fr}.hero-stage{min-height:175px}.hero-stage .pixel-hero{height:100px}.object-groups{grid-template-columns:1fr}.plus-sticker{text-align:center;line-height:.7}.result-heading{align-items:flex-start}.question-top .hero-sticker span{display:none}.doodle-strip{font-size:11px}}


/* SIX BLOCK-WORLD SKILL LOCATIONS */
.world-intro{margin:18px 0 20px;padding:15px 17px;border:2px dashed var(--line);border-radius:12px;background:var(--notice);box-shadow:3px 3px 0 var(--shadow)}
.world-intro-sticker{display:inline-block;padding:5px 9px;background:var(--accent);border:2px solid var(--line);font-size:12px;font-weight:1000;letter-spacing:.08em;transform:rotate(-1deg)}
.world-intro p{margin:10px 0 0;font-weight:700}
.world-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:18px 0}
.world-card{position:relative;min-width:0;overflow:hidden;padding:14px;border:3px solid var(--line);border-radius:14px;background:var(--card-top);box-shadow:5px 5px 0 var(--shadow)}
.world-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.world-icon{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--line);border-radius:9px;background:var(--accent);font-size:24px;box-shadow:2px 2px 0 var(--shadow)}
.world-number{font-size:11px;font-weight:1000;letter-spacing:.09em}
.world-scene{position:relative;height:94px;margin:11px -2px 12px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#7bd9f4 0 68%,#b4e66b 68% 100%);image-rendering:pixelated}
.world-scene:before,.world-scene:after{content:"";position:absolute;background:#fff;border:2px solid #171717}
.world-scene:before{width:46px;height:14px;top:15px;left:16%;box-shadow:10px -8px 0 -2px #fff,10px -8px 0 0 #171717}
.world-scene:after{width:35px;height:12px;top:28px;right:18%;box-shadow:8px -7px 0 -2px #fff,8px -7px 0 0 #171717}
.block-ground{position:absolute;bottom:0;left:0;width:100%;height:25px;background:repeating-linear-gradient(90deg,#5d9d3c 0 18px,#47812f 18px 36px);border-top:3px solid #171717}
.block-hill{position:absolute;bottom:22px;width:62px;height:35px;background:#4f9c3d;border:3px solid #171717;clip-path:polygon(0 100%,0 55%,28% 55%,28% 20%,67% 20%,67% 0,100% 0,100% 100%)}
.hill-a{left:10%}.hill-b{right:9%;transform:scale(.72);transform-origin:bottom right}
.block-cloud{position:absolute;top:10px;left:47%;width:25px;height:12px;background:#fff;border:2px solid #171717;box-shadow:12px -5px 0 -1px #fff,12px -5px 0 1px #171717}
.world-mob{position:absolute;z-index:2;bottom:20px;left:48%;font-size:34px;filter:drop-shadow(2px 2px 0 #171717)}
.biome-mountain .world-scene{background:linear-gradient(#80d5f5 0 100%)}
.biome-mountain .block-hill{background:#9aa7b2}
.biome-cave .world-scene{background:linear-gradient(#38445e,#161b2d)}
.biome-cave .block-ground,.biome-cave .block-hill{background:#596273}
.biome-village .world-scene{background:linear-gradient(#8bdcf3 0 68%,#9dce63 68%)}
.biome-village .world-mob{font-size:40px}
.biome-forest .world-scene{background:linear-gradient(#92d9ee 0 65%,#4b9c45 65%)}
.biome-forest .block-hill{background:#287044}
.biome-snow .world-scene{background:linear-gradient(#bdeaff 0 68%,#fff 68%)}
.biome-snow .block-ground{background:repeating-linear-gradient(90deg,#f9ffff 0 18px,#c8e6f4 18px 36px)}
.world-biome{font-size:11px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;color:var(--primary)}
.world-card h3{margin:4px 0 3px;font-size:20px;line-height:1.15}
.world-skill{margin:0 0 5px;font-weight:900}
.world-hint{min-height:42px;margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.4}
.world-progress-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;font-weight:1000}
.world-progress-head strong:last-child{font-size:19px;color:var(--primary)}
.world-xp{height:15px;overflow:hidden;border:2px solid var(--line);border-radius:4px;background:var(--inset);box-shadow:inset 0 1px 2px #0002}
.world-xp span{display:block;height:100%;background:repeating-linear-gradient(135deg,#22c5e8 0 9px,#45d5ed 9px 18px);border-right:2px solid var(--line)}
.world-card-bottom{display:flex;justify-content:space-between;gap:7px;align-items:center;margin-top:8px;font-size:11px;font-weight:900;flex-wrap:wrap}
.world-stage{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--notice)}
@media(max-width:620px){.world-map{grid-template-columns:1fr}.world-hint{min-height:0}.world-scene{height:100px}}


/* THREE INDIVIDUAL TASKS PER MINECRAFT LOCATION */
.results-section-title{margin:24px 0 12px;padding:7px 10px;display:inline-block;background:var(--accent);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);font-size:15px;letter-spacing:.06em}
.world-task-list{margin-top:12px;padding:9px 10px;background:var(--inset);border:2px dashed var(--line);border-radius:9px}
.world-task-title{margin-bottom:6px;font-size:10px;font-weight:1000;letter-spacing:.09em}
.world-task-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--line) 25%,transparent);font-size:12px;font-weight:800}
.world-task-row strong{font-size:11px;white-space:nowrap}
.task-done{color:var(--good)}
.task-retry{color:var(--bad)}
.wheel{margin:12px 0 20px}

 {id:'q10',skillId:'S4',instruction:'Прочитай задачу и выбери правильный ответ.',materials:[{type:'text',title:'Условие задачи',content:'У Маши было 8 красных карандашей и 6 синих. Сколько всего карандашей было у Маши?'},{type:'visual',title:'Представь карандаши',groups:[{label:'Красные карандаши',count:8,emoji:'🖍️'},{label:'Синие карандаши',count:6,emoji:'✏️'}]}],kind:'radio',options:[['12','12 карандашей'],['14','14 карандашей'],['15','15 карандашей']],correct:'14',answer:'14 карандашей',explain:'Нужно узнать, сколько карандашей всего: 8 + 6 = 14.',recommend:'Повтори задачи на нахождение суммы: когда спрашивают «сколько всего», количества складывают.'},

 {id:'q17',skillId:'S6',instruction:'Выбери пару чисел: предыдущее и следующее для числа 14.',materials:[{type:'formula',title:'Числовой ряд',content:'□   14   □'}],kind:'radio',options:[['12-15','12 и 15'],['13-15','13 и 15'],['15-16','15 и 16']],correct:'13-15',answer:'13 и 15',explain:'Перед 14 стоит 13, после 14 — 15.',recommend:'Повтори, как находить предыдущее и следующее число.'},

const answers = {};
let current = 0;
let screen = 'start';
let results = null;
const view = document.getElementById('view');
const themeSelect = document.getElementById('theme');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setTheme(value){document.documentElement.dataset.theme=value;themeSelect.value=value;}
themeSelect.addEventListener('change',e=>setTheme(e.target.value));
function focusHeading(selector){const el=view.querySelector(selector);if(el){el.focus({preventScroll:true});el.scrollIntoView({behavior:'instant',block:'start'});}}

function heroSVG(kind='steve',label=''){
 const palettes={
  steve:{skin:'#c98d62',hair:'#49342b',shirt:'#2387c9',pants:'#344f9b',detail:'#1d273c'},
  alex:{skin:'#e7b18a',hair:'#d87524',shirt:'#4a9b55',pants:'#6b4934',detail:'#263b2a'},
  creeper:{skin:'#63bd52',hair:'#347d37',shirt:'#63bd52',pants:'#397f38',detail:'#173b22'}
 };
 const c=palettes[kind]||palettes.steve;
 if(kind==='creeper') return `<svg class="pixel-hero creeper" viewBox="0 0 120 140" role="img" aria-label="Крипер из кубического мира"><rect x="25" y="5" width="70" height="70" rx="2" fill="${c.skin}" stroke="#171717" stroke-width="5"/><rect x="38" y="25" width="14" height="14" fill="#17251b"/><rect x="68" y="25" width="14" height="14" fill="#17251b"/><path d="M52 42h16v12h10v14H42V54h10z" fill="#17251b"/><rect x="33" y="75" width="54" height="52" fill="${c.skin}" stroke="#171717" stroke-width="5"/><rect x="34" y="112" width="20" height="18" fill="#2f7138" stroke="#171717" stroke-width="4"/><rect x="66" y="112" width="20" height="18" fill="#2f7138" stroke="#171717" stroke-width="4"/></svg>`;
 return `<svg class="pixel-hero" viewBox="0 0 120 150" role="img" aria-label="${kind==='alex'?'Алекс':'Стив'} из кубического мира"><rect x="25" y="4" width="70" height="57" fill="${c.skin}" stroke="#171717" stroke-width="5"/><path d="M22 28V7h75v18H80V15H37v13z" fill="${c.hair}" stroke="#171717" stroke-width="5"/><rect x="38" y="31" width="12" height="8" fill="#171717"/><rect x="70" y="31" width="12" height="8" fill="#171717"/><rect x="50" y="49" width="20" height="5" fill="#8d3c36"/><rect x="33" y="61" width="54" height="48" fill="${c.shirt}" stroke="#171717" stroke-width="5"/><rect x="22" y="65" width="13" height="42" fill="${c.skin}" stroke="#171717" stroke-width="4"/><rect x="85" y="65" width="13" height="42" fill="${c.skin}" stroke="#171717" stroke-width="4"/><rect x="35" y="108" width="23" height="35" fill="${c.pants}" stroke="#171717" stroke-width="5"/><rect x="62" y="108" width="23" height="35" fill="${c.pants}" stroke="#171717" stroke-width="5"/><rect x="31" y="139" width="29" height="8" fill="${c.detail}"/><rect x="60" y="139" width="29" height="8" fill="${c.detail}"/></svg>`;
}
function heroSticker(kind,caption){
 return `<div class="hero-sticker">${heroSVG(kind)}<span>${caption}</span></div>`;
}

function renderStart(){screen='start';view.innerHTML=`
<section class="card cover-card">

function materialHTML(m){
 if(m.type==='visual') return `<section class="task-material visual-material"><h3 class="material-title">${esc(m.title)}</h3><div class="material-content object-groups">${m.groups.map(g=>`<div class="object-group"><div class="object-label">${esc(g.label)} <b>${g.count} шт.</b></div><div class="objects" aria-label="${esc(g.label)}: ${g.count}">${Array.from({length:g.count},()=>`<span aria-hidden="true">${g.emoji}</span>`).join('')}</div></div>`).join('<div class="plus-sticker">+</div>')}<div class="visual-hint">Посчитай все предметы вместе!</div></div></section>`;
 if(m.type==='formula') return `<section class="task-material"><h3 class="material-title">${esc(m.title)}</h3><div class="material-content material-formula">${esc(m.content)}</div></section>`;
 if(m.type==='text') return `<section class="task-material"><h3 class="material-title">${esc(m.title)}</h3><div class="material-content"><p>${esc(m.content)}</p></div></section>`;
 if(m.type==='table') return `<section class="task-material"><h3 class="material-title">${esc(m.title)}</h3><div class="material-content material-scroll"><table class="material-table"><thead><tr>${m.rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${m.rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
 return '';
}
function answerHTML(q){
 if(q.kind==='radio') return `<fieldset class="answer-group" aria-describedby="question-title"><legend class="answer-label">Выбери один ответ</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${esc(o[0])}" ${answers[q.id]===o[0]?'checked':''}><span><b>${i+1}.</b> ${esc(o[1])}</span></label>`).join('')}</div></fieldset>`;
 return `<fieldset class="answer-group" aria-describedby="question-title"><legend class="answer-label">Твой ответ</legend><label for="numberAnswer">${esc(q.hint)}</label><input class="answer" id="numberAnswer" type="number" inputmode="numeric" min="0" max="20" step="1" autocomplete="off" value="${answers[q.id]!==undefined?esc(answers[q.id]):''}"><p class="answer-hint">Введи число от 0 до 20.</p></fieldset>`;
}
function isAnswered(q){const a=answers[q.id];return q.kind==='radio'?typeof a==='string'&&a.length>0:a!==undefined&&String(a).trim()!==''&&Number.isInteger(Number(a))&&Number(a)>=0&&Number(a)<=20;}
function renderQuestion(){screen='questions';const q=questions[current];const skill=skills.find(s=>s.id===q.skillId);view.innerHTML=`<section class="card" aria-labelledby="question-title">
<div class="question-top"><p class="muted">ВОПРОС ${current+1} ИЗ ${questions.length} · ${esc(skill.name)}</p>${heroSticker(current%3===0?'steve':current%3===1?'alex':'creeper','ВПЕРЁД!')}</div>
<div class="bar" aria-label="Прогресс прохождения"><span style="width:${(current+1)/questions.length*100}%"></span></div>
<h2 class="question-title" id="question-title" tabindex="-1">${esc(q.instruction)}</h2>
<div class="task-materials">${q.materials.map(materialHTML).join('')}</div>
${answerHTML(q)}
<div class="actions"><button class="secondary" id="backBtn" type="button" ${current===0?'disabled':''}>Назад</button><button class="primary" id="nextBtn" type="button" ${isAnswered(q)?'':'disabled'}>${current===questions.length-1?'Завершить':'Далее'}</button></div>
</section>`;
 const next=document.getElementById('nextBtn');
 view.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{answers[q.id]=el.value;next.disabled=!isAnswered(q);}));
 const number=document.getElementById('numberAnswer');if(number)number.addEventListener('input',()=>{if(number.value.trim()===''){delete answers[q.id];}else{answers[q.id]=number.value;}next.disabled=!isAnswered(q);});
 document.getElementById('backBtn').addEventListener('click',()=>{if(current>0){current--;renderQuestion();}});
 next.addEventListener('click',()=>{if(!isAnswered(q))return;if(current<questions.length-1){current++;renderQuestion();}else{calculateResults();renderResults();}});
 focusHeading('#question-title');}
function calculateResults(){let total=0;const bySkill=skills.map(s=>{const qs=questions.filter(q=>q.skillId===s.id);const earned=qs.reduce((sum,q)=>sum+(isCorrect(q)?1:0),0);total+=earned;return {...s,earned,max:qs.length,pct:qs.length?earned/qs.length*100:null,count:qs.length};});results={total,max:questions.length,pct:total/questions.length*100,bySkill};}
function isCorrect(q){if(q.kind==='radio')return answers[q.id]===q.correct;return q.accepted.includes(String(answers[q.id]??'').trim());}
function level(pct){if(pct>=80)return 'Хорошо получается';if(pct>=50)return 'Стоит закрепить';return 'Нужно повторить';}
function radarSVG(data){const n=data.length,cx=280,cy=210,r=145,angle=i=>-Math.PI/2+2*Math.PI*i/n,pt=(i,rr)=>[cx+rr*Math.cos(angle(i)),cy+rr*Math.sin(angle(i))];let s='';[.25,.5,.75,1].forEach(k=>{const pts=data.map((_,i)=>pt(i,r*k).join(',')).join(' ');s+=`<polygon class="grid" points="${pts}"/>`;});data.forEach((d,i)=>{const [x,y]=pt(i,r);s+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;const [tx,ty]=pt(i,173);s+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`;});const coords=data.map((d,i)=>pt(i,r*d.pct/100));for(let k=1;k<=24;k++){const p=coords.map(([x,y])=>`${cx+(x-cx)*k/24},${cy+(y-cy)*k/24}`).join(' ');s+=`<polygon points="${p}" fill="none" stroke="var(--accent)" stroke-width="0.6" opacity="0.4"/>`;}s+=`<polygon class="result" points="${coords.map(p=>p.join(',')).join(' ')}"/>`;return `<div class="wheel"><div class="wheelHead"><span>Карта знаний · шкала 0–100%</span><span>Номера навыков</span></div><svg viewBox="0 0 560 440" role="img" aria-label="Круговая карта результатов: ${data.map((d,i)=>`навык ${i+1} — ${Math.round(d.pct)} процентов`).join('; ')}">${s}</svg></div>`;}

const worldLocations = [
 {id:'S1',name:'Долина счёта',biome:'Равнина',icon:'🌾',scene:'plains',tag:'Сложение и вычитание',hint:'Собирай числа и открывай новые пути.'},
 {id:'S2',name:'Гора сравнений',biome:'Горный биом',icon:'⛰️',scene:'mountain',tag:'Сравнение чисел',hint:'Находи, какое число выше или ниже.'},
 {id:'S3',name:'Шахта загадок',biome:'Пещеры',icon:'⛏️',scene:'cave',tag:'Неизвестное число',hint:'Ищи потерянные числа в глубине шахты.'},
 {id:'S4',name:'Деревня задач',biome:'Деревня',icon:'🏡',scene:'village',tag:'Текстовые задачи',hint:'Помогай жителям решать математические задачи.'},
 {id:'S5',name:'Лес данных',biome:'Лес',icon:'🌲',scene:'forest',tag:'Работа с данными',hint:'Исследуй таблицы и сравнивай находки.'},
 {id:'S6',name:'Ледяной маршрут',biome:'Снежный биом',icon:'❄️',scene:'snow',tag:'Последовательность чисел',hint:'Прокладывай путь по числовому ряду.'}
];
function worldMapHTML(data){
 const cards=data.map((s,i)=>{
  const place=worldLocations.find(x=>x.id===s.id);
  const pct=Math.round(s.pct);
  const stage=pct>=80?'Локация освоена':pct>=50?'Путь открыт':'Нужно потренироваться';
  return `<article class="world-card biome-${place.scene}">
    <div class="world-card-top"><span class="world-icon" aria-hidden="true">${place.icon}</span><span class="world-number">МИР ${String(i+1).padStart(2,'0')}</span></div>
    <div class="world-scene" aria-hidden="true"><span class="block-cloud"></span><span class="block-hill hill-a"></span><span class="block-hill hill-b"></span><span class="block-ground"></span><span class="world-mob">${i===2?'⛏️':i===3?'🏠':i===4?'🐝':i===5?'☃️':i===1?'💎':'🧑‍🌾'}</span></div>
    <div class="world-biome">${esc(place.biome)}</div>
    <h3>${esc(place.name)}</h3>
    <p class="world-skill">${esc(s.name)}</p>
    <p class="world-hint">${esc(place.hint)}</p>
    <div class="world-progress-head"><strong>ПРОКАЧКА</strong><strong>${pct}%</strong></div>
    <div class="world-xp" role="progressbar" aria-label="Прокачка навыка ${esc(s.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
    <div class="world-task-list"><div class="world-task-title">ТРИ ЗАДАНИЯ ЛОКАЦИИ</div>${questions.filter(q=>q.skillId===s.id).map((q,qi)=>`<div class="world-task-row"><span>Задание ${qi+1}</span><strong class="${isCorrect(q)?'task-done':'task-retry'}">${isCorrect(q)?'✓ Выполнено':'↻ Повторить'}</strong></div>`).join('')}</div>
    <div class="world-card-bottom"><span>${s.earned} / ${s.max} XP</span><span class="world-stage">${stage}</span></div>
   </article>`;
 }).join('');
 return `<div class="world-intro"><div class="world-intro-sticker">ТВОЙ МИР · ТВОИ ДОСТИЖЕНИЯ</div><p>Каждый навык — отдельная локация. Выполненные задания превращаются в опыт и прокачивают твой мир!</p></div><div class="world-map">${cards}</div>`;
}

function renderResults(){screen='results';const d=results.bySkill;view.innerHTML=`<section class="card"><div class="result-heading"><div><div class="comic-kicker">ТВОЙ РЕЗУЛЬТАТ</div><h2 id="screen-title" tabindex="-1">Карта знаний</h2></div>${heroSticker('creeper','КРУТО!')}</div><p class="result-summary">${results.total} из ${results.max} баллов · ${Math.round(results.pct)}%</p><p class="muted">Результаты показывают, как выполнены именно эти задания.</p><h3 class="results-section-title">ДИАГРАММА НАВЫКОВ</h3>${radarSVG(d)}<h3 class="results-section-title">ТВОЙ MINECRAFT-МИР</h3>${worldMapHTML(d)}<div class="actions"><button class="primary" id="recommendBtn" type="button">Что повторить</button><button id="errorsBtn" type="button">Посмотреть ошибки</button><button class="secondary" id="restartBtn" type="button">Пройти заново</button></div></section>`;
 document.getElementById('recommendBtn').addEventListener('click',renderRecommendations);document.getElementById('errorsBtn').addEventListener('click',renderErrors);document.getElementById('restartBtn').addEventListener('click',restart);focusHeading('#screen-title');}
function renderRecommendations(){screen='recommendations';const strong=results.bySkill.filter(s=>s.pct>=80);const weak=results.bySkill.filter(s=>s.pct<80).sort((a,b)=>a.pct-b.pct||skills.findIndex(x=>x.id===a.id)-skills.findIndex(x=>x.id===b.id));let html='';if(strong.length){html+=`<h3>Что уже получается</h3><ul>${strong.map(s=>`<li>${esc(s.name)} — ${Math.round(s.pct)}%.</li>`).join('')}</ul>`;}if(weak.length){html+=`<h3>С чего начать</h3><div class="notice"><strong>${esc(weak[0].name)} — ${Math.round(weak[0].pct)}%</strong><p>${esc(weak[0].repeat)}</p><p><strong>Следующий шаг:</strong> ${esc(weak[0].step)}</p></div>`;if(weak.length>1){html+='<h3>Что ещё стоит закрепить</h3>'+weak.slice(1).map(s=>`<div class="review"><strong>${esc(s.name)} — ${Math.round(s.pct)}%</strong><p>${esc(s.repeat)}</p><p><strong>Следующий шаг:</strong> ${esc(s.step)}</p></div>`).join('');}}else{html+='<div class="notice success">По этим заданиям все проверенные навыки на высоком уровне.</div>';}if(!strong.length)html='<p class="muted">Пока нет навыков с результатом 80% и выше. Это не оценка способностей ребёнка, а повод спокойно повторить материал.</p>'+html;
 view.innerHTML=`<section class="card"><h2 id="screen-title" tabindex="-1">Рекомендации</h2>${html}<div class="actions"><button class="primary" id="toResults" type="button">К результатам</button><button class="secondary" id="restartBtn" type="button">Пройти заново</button></div></section>`;document.getElementById('toResults').addEventListener('click',renderResults);document.getElementById('restartBtn').addEventListener('click',restart);focusHeading('#screen-title');}
function userAnswer(q){const a=answers[q.id];if(a===undefined||String(a).trim()==='')return 'Ответ не указан';if(q.kind==='radio'){const o=q.options.find(x=>x[0]===a);return o?o[1]:String(a);}return String(a);}
function renderErrors(){screen='errors';const wrong=questions.filter(q=>!isCorrect(q));const content=wrong.length?wrong.map((q,i)=>`<div class="review"><h3>Задание ${questions.indexOf(q)+1} · ${esc(skills.find(s=>s.id===q.skillId).name)}</h3><p><strong>${esc(q.instruction)}</strong></p><div class="task-materials">${q.materials.map(materialHTML).join('')}</div><div class="review-answer"><span>Твой ответ</span><strong class="error-text">${esc(userAnswer(q))}</strong><span>Правильный ответ</span><strong>${esc(q.answer)}</strong><span>Баллы</span><strong>0 из 1</strong></div><p>${esc(q.explain)}</p></div>`).join(''):'<div class="notice success">Все ответы верные.</div>';
 view.innerHTML=`<section class="card"><h2 id="screen-title" tabindex="-1">Разбор ошибок</h2>${content}<div class="actions"><button class="primary" id="toResults" type="button">К результатам</button></div></section>`;document.getElementById('toResults').addEventListener('click',renderResults);focusHeading('#screen-title');}
function restart(){Object.keys(answers).forEach(k=>delete answers[k]);results=null;current=0;renderStart();}
setTheme('graphite');renderStart();
</script>
</body>
</html>
